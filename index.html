/* ---- turn codes: play anyone, anywhere, no sign-in ---- */
function b64u(u){let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64u(str){str=str.replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const b=atob(str);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
function packCode(g){const o=pack(g);o.f=g.fx.slice(-8).map(f=>({n:f.n,t:String(f.t).slice(0,90),d:f.dice||[],m:f.m||'n',r:String(f.res||'').slice(0,40),ok:f.ok?1:0,x:f.x?1:0,md:f.md?1:0,s:si(f.s),c:f.cols?1:0,sb:f.sub?String(f.sub).slice(0,40):undefined}));o.l=g.log.slice(-25).map(l=>[l.i||0,String(l.t).slice(0,240),l.s==='US'?0:l.s==='PRC'?1:2]);o.sq=g.seq||0;o.st=g.stats;return o}
async function encodeState(){
 const json=JSON.stringify(packCode(G));let bytes=new TextEncoder().encode(json);let pre='OCS1';
 if(window.CompressionStream){try{const cs=new CompressionStream('deflate-raw');const w=cs.writable.getWriter();w.write(bytes);w.close();bytes=new Uint8Array(await new Response(cs.readable).arrayBuffer());pre='OCS2'}catch(e){bytes=new TextEncoder().encode(json);pre='OCS1'}}
 return pre+'.'+b64u(bytes);
}
async function decodeState(str){
 str=String(str||'').replace(/\s+/g,'');if(str.length>40000)throw new Error('too long');
 const m=/^(OCS[12])\.([A-Za-z0-9_-]+)$/.exec(str);if(!m)throw new Error('format');
 let bytes=unb64u(m[2]);
 if(m[1]==='OCS2'){if(!window.DecompressionStream)throw new Error('This browser cannot read compressed codes.');const ds=new DecompressionStream('deflate-raw');const w=ds.writable.getWriter();w.write(bytes);w.close();bytes=new Uint8Array(await new Response(ds.readable).arrayBuffer())}
 const o=JSON.parse(new TextDecoder().decode(bytes));
 if(!o||!Array.isArray(o.h)||o.h.length<16||!Array.isArray(o.t)||!Array.isArray(o.q)||!Array.isArray(o.s)||o.s.length!==2||o.t.length%10||o.q.length%9)throw new Error(o&&o.gv!==GV?'version':'shape');
 if(![...o.h,...o.t,...o.q].every(x=>typeof x==='number'&&isFinite(x)))throw new Error('values');
 return o;
}
function save(){
 if(!G)return;
 if(G.mode==='code'){try{localStorage.setItem('ocs-codegame',JSON.stringify({g:G,side:UI.codeSide}))}catch(e){}return}
 if(G.mode==='net'||G.mode==='tut'||G.mode==='drill')return;try{localStorage.setItem('ocs-save',JSON.stringify(G))}catch(e){}
}
H.newcode=()=>{modal(`<h2>Play by turn code</h2><p class="small">Works on any phone or computer with no account. After each of your turns you get a short code: send it to your opponent by text, Teams or email. They paste it here, take their turn, and send one back.</p><div class="opts" style="margin-top:0"><div class="opt"><label class="lbl" for="cSide">Your side</label><select id="cSide"><option value="US">US / Allied</option><option value="PRC">PRC</option></select></div><div class="opt"><label class="lbl" for="cAto">Campaign</label><select id="cAto"><option value="1">1 ATO</option><option value="2" selected>2 ATOs</option></select></div></div><div class="acts2"><button class="btn" data-a="pastecode">I have a code</button><button class="btn pri" data-a="startcode">Start a new game</button></div>`)};
H.startcode=()=>{const side=$('#cSide').value,atos=+$('#cAto').value;closeModal();TUT.on=false;newGame('code',{atos,coach:false});G.netCode=randCode()+randCode();G.seq=0;UI.codeSide=side;UI.fxSeen=0;UI.sel=null;UI.selSq=null;UI.mode=null;afterChange(true)};
async function codeSendModal(final){
 let code='';try{code=await encodeState()}catch(e){toast('Could not build a code: '+esc(e.message));return}
 const a=actorSide();
 modal(`<h2>${final?'Send the final code':'Send your turn code'}</h2><p class="small">${final?'Your opponent needs this to see the final result.':`It’s <b>${a}</b>’s move now. Copy this code and send it to your opponent. When they reply with their code, tap <b>Paste code</b>.`}</p><textarea id="codeTA" class="codeta" rows="5" readonly aria-label="Turn code">${esc(code)}</textarea><p class="small muted">${code.length} characters · game ${esc(G.netCode||'')}</p><div class="acts2"><button class="btn" data-a="mclose">Close</button><button class="btn" data-a="pastecode">Paste reply</button><button class="btn pri" data-a="copycode">Copy code</button></div>`);
}
H.copycode=()=>{const ta=$('#codeTA');const fb=()=>{ta.focus();ta.select();toast('Select the whole code and copy it.')};try{navigator.clipboard.writeText(ta.value).then(()=>toast('Copied. Paste it into a message to your opponent.'),fb)}catch(e){fb()}};
H.showcode=()=>{if(G)codeSendModal(G.phase==='over')};
H.pastecode=()=>{modal(`<h2>Paste your opponent’s code</h2><textarea id="pasteTA" class="codeta" rows="6" placeholder="OCS2.…" aria-label="Opponent's code"></textarea><p class="small muted">Paste the whole code, starting with OCS. You’ll watch their dice, then take your turn.</p><div class="acts2"><button class="btn" data-a="mclose">Cancel</button><button class="btn pri" data-a="loadcode">Load code</button></div>`);setTimeout(()=>{const t=$('#pasteTA');if(t)t.focus()},30)};
H.loadcode=async()=>{
 const s=$('#pasteTA')&&$('#pasteTA').value;let o;try{o=await decodeState(s)}catch(e){toast(e.message==='version'?'That code is from an older version of the simulator. Start a new turn-code game.':'That code couldn’t be read. Copy the whole code, starting with OCS.');return}
 let g;try{g=unpack(o)}catch(e){toast('That code is damaged.');return}
 g.mode='code';g.seq=o.sq||0;if(o.st)g.stats=o.st;g.names=g.names||{US:'',PRC:''};
 const same=G&&G.mode==='code'&&G.netCode&&G.netCode===g.netCode;
 if(same){if(g.seq<=G.seq){toast('That code isn’t newer than your game. Ask your opponent for their latest code.');return}
  const lastI=G.log.length?G.log[G.log.length-1].i||0:0;g.log=G.log.concat(g.log.filter(l=>(l.i||0)>lastI)).slice(-80);G=g}
 else{G=g;UI.codeSide=actorSide()||'US';UI.fxSeen=0}
 closeModal();TUT.on=false;UI.sel=null;UI.selSq=null;UI.mode=null;UI.sheet=null;save();
 SCREEN=G.phase==='setup'&&!isLocal(G.setupSide)?'wait':G.phase==='over'?'results':G.phase==='atoEnd'?'atoEnd':G.phase==='setup'?'setup':'game';
 if(SCREEN==='setup')UI.setup=freshSetupUI(G.setupSide);
 render();toast(`Loaded. You are ${UI.codeSide}.`);if(SCREEN==='game')await playNewFx();afterChange(false);
};
H.resumecode=()=>{try{const c=JSON.parse(localStorage.getItem('ocs-codegame'));if(!c||!c.g||c.g.v!==GV){try{localStorage.removeItem('ocs-codegame')}catch(e){}toast('That game is from an older version.');return}G=c.g;UI.codeSide=c.side;UI.fxSeen=G.fxn;UI.sel=null;UI.selSq=null;UI.mode=null;UI.lastActor=null;afterChange(false)}catch(e){toast('Could not load that game.')}};

/* ---- offline copy ---- */
let DLNS=null;(async()=>{try{if(window.claude&&typeof claude.use==='function')DLNS=await claude.use('downloads')}catch(e){DLNS=null}})();
function offlineHTML(){try{const doc=new DOMParser().parseFromString(OCS_SRC,'text/html');doc.querySelectorAll('script').forEach(s=>{if(!(s.textContent||'').includes('OCS-MAIN'))s.remove()});const a=doc.getElementById('app');if(a)a.innerHTML='';const l=doc.getElementById('layer');if(l)l.innerHTML='';return '<!doctype html>\n'+doc.documentElement.outerHTML}catch(e){return OCS_SRC}}
H.download=async()=>{
 const html=offlineHTML();const fn='crimson-scorpion-simulator.html';
 if(DLNS){try{await DLNS.save({filename:fn,data:html});toast('Saved. Open it in any browser, or share the file with your class.')}catch(e){if(e&&e.code==='unavailable')fallbackDl(html,fn);else if(e&&e.code)toast('Download wasn’t completed ('+esc(e.code)+').')}return}
 fallbackDl(html,fn);
};
function fallbackDl(html,fn){try{const url=URL.createObjectURL(new Blob([html],{type:'text/html'}));const a=document.createElement('a');a.href=url;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);toast('Downloading the simulator file.')}catch(e){toast('Downloading isn’t available in this view.')}}

/* ---- motion: tokens glide between bands and fly out of their squadron card ---- */
const _renderGame=renderGame;
renderGame=function(){
 const before={};document.querySelectorAll('.board [data-id]').forEach(el=>{const r=el.getBoundingClientRect();if(r.width)before[el.dataset.id]=r});
 _renderGame();
 if(RM||UI.speed<0.3||!G)return;
 document.querySelectorAll('.board [data-id]').forEach(el=>{let b=before[el.dataset.id];const t=tok(+el.dataset.id);
  if(!b&&t&&t.q!=null)b=before[t.q];if(!b||!el.animate)return;const r=el.getBoundingClientRect();const dx=b.left-r.left,dy=b.top-r.top;if(Math.abs(dx)+Math.abs(dy)<2)return;
  el.animate([{transform:`translate(${dx}px,${dy}px) scale(${before[el.dataset.id]?1:.6})`},{transform:'none'}],{duration:spd(420),easing:'cubic-bezier(.2,.75,.2,1)'})});
};
/* ---- drag a token onto a band to move it ---- */
let DRAG=null;
document.addEventListener('pointerdown',e=>{
 const el=e.target.closest&&e.target.closest('.board .tok');if(!el||!G||SCREEN!=='game'||!myTurn()||UI.mode&&UI.mode!=='move')return;
 const t=tok(+el.dataset.id);if(!t||t.s!==G.turn||G.act.mv||(G.act.actv&&!G.act.hot)||!moveOptions(t).length)return;
 DRAG={id:t.id,x0:e.clientX,y0:e.clientY,started:false};
});
document.addEventListener('pointermove',e=>{
 if(!DRAG)return;if(!DRAG.started){if(Math.hypot(e.clientX-DRAG.x0,e.clientY-DRAG.y0)<9)return;DRAG.started=true;UI.sel=DRAG.id;UI.selSq=null;UI.mode='move';render();
  const src=document.querySelector(`.board [data-id="${DRAG.id}"]`);const g=src?src.cloneNode(true):document.createElement('div');g.classList.add('dragghost');g.removeAttribute('data-a');document.body.appendChild(g);DRAG.g=g;if(src)src.classList.add('dragsrc')}
 DRAG.g.style.left=e.clientX+'px';DRAG.g.style.top=e.clientY+'px';
 document.querySelectorAll('.droph').forEach(x=>x.classList.remove('droph'));
 DRAG.g.style.display='none';const under=document.elementFromPoint(e.clientX,e.clientY);DRAG.g.style.display='';const row=under&&under.closest('[data-a="row"]');if(row)row.classList.add('droph');
},{passive:true});
document.addEventListener('pointerup',e=>{
 if(!DRAG)return;const d=DRAG;DRAG=null;if(!d.started)return;
 UI.justDragged=true;setTimeout(()=>UI.justDragged=false,60);
 d.g.style.display='none';const under=document.elementFromPoint(e.clientX,e.clientY);d.g.remove();
 const row=under&&under.closest('[data-a="row"]');if(row&&UI.mode==='move'){H.row(row.dataset);return}
 UI.mode=null;render();
});
window.addEventListener('click',e=>{if(UI.justDragged){e.stopPropagation();e.preventDefault()}},true);

/* ---- dice roller on a felt tray ---- */
function drVerdict(o){
 if(!o)return '<span class="small muted">Pick a target number, then roll. You can also roll real dice and use this only to check results.</span>';
 let v='';
 if(o.init)v=`<span class="res ok">${o.init} WINS INITIATIVE</span>`;else if(o.dmg)v=`<span class="res neu">${o.val} DAMAGE</span>`;else if(o.sum)v=`<span class="res neu">TOTAL ${o.val}</span>`;
 else if(o.need)v=`<span class="res ${o.ok?'ok':'bad'}">${o.ok?(o.expl?'HIT · ROLL DAMAGE':'SUCCESS'):(o.expl?'MISS':'FAIL')}</span>`;else v=`<span class="res neu">${o.tot??o.val}</span>`;
 return `<div class="lbl">${esc(o.kind)}</div><div class="mono small">${o.need?`${o.m?'kept ':''}${o.val}${UI.dr.mod?` ${UI.dr.mod>0?'+':'−'} ${Math.abs(UI.dr.mod)}`:''} = ${o.tot} vs ${o.need}+`:''}</div>${v}`;
}
function diceModal(){
 const D=UI.dr;const o=D.last;
 const seg=(id,vals,cur,lbl)=>`<div class="seg" role="group" aria-label="${lbl}">${vals.map(([v,t])=>`<button class="btn sm ${cur===v?'on pri':''}" data-a="${id}" data-v="${v}" aria-pressed="${cur===v}">${t}</button>`).join('')}</div>`;
 const li=o?loseIndex(o.dice,o.m):-1;
 const felt=`<div class="felt drfelt" id="drfelt">${o?o.dice.map((v,i)=>`<div class="d4${i===li?' lose':''}" style="transform:${(D.lastPos&&D.lastPos[i])||`translate(${90+i*90}px,44px)`}">${d4TopSVG(v,o.cols[i],i===li)}</div>`).join(''):'<div class="drempty">Your dice land here</div>'}</div>`;
 const html=`<div class="row" style="justify-content:space-between"><h2>Dice roller</h2><button class="btn sm ghost" data-a="mclose" aria-label="Close">✕</button></div>
 <p class="small muted" style="margin:0 0 10px">Four-sided dice like the ones in the box. Read the number at the top point.</p>
 <div class="drgrid"><div><div class="lbl">Team dice</div>${seg('drc',[['US','Blue · US'],['PRC','Red · PRC']],D.col,'Team dice')}</div><div><div class="lbl">Need (target)</div>${seg('drn',[[0,'None'],[1,'1+'],[2,'2+'],[3,'3+'],[4,'4+']],D.need,'Target number')}</div><div><div class="lbl">Modifier (bonus or EW)</div>${seg('drm',[[-2,'−2'],[-1,'−1'],[0,'0'],[1,'+1'],[2,'+2']],D.mod,'Modifier')}</div></div>
 <div class="drout" aria-live="polite" style="min-height:0;padding:8px">${felt}<div class="drverdict" id="drv">${drVerdict(o)}</div>${D.need?`<div class="small muted">Chance: ${pct(probNeed(D.need,D.mod,'n'))} normal · ${pct(probNeed(D.need,D.mod,'adv'))} advantage · ${pct(probNeed(D.need,D.mod,'dis'))} disadvantage</div>`:''}</div>
 <div class="drbtns">${D.pendDmg?`<button class="btn pri" data-a="drr" data-k="dmg" style="grid-column:1/-1">Roll the damage die</button>`:''}
  <button class="btn ${D.pendDmg?'':'pri'}" data-a="drr" data-k="one">Roll 1d4</button><button class="btn" data-a="drr" data-k="adv">Advantage</button><button class="btn" data-a="drr" data-k="dis">Disadvantage</button><button class="btn" data-a="drr" data-k="expl">Exploding shot</button><button class="btn" data-a="drr" data-k="two">2d4 total</button><button class="btn" data-a="drr" data-k="init">Initiative bid</button></div>
 <details class="small" style="margin-top:10px"><summary class="lbl" style="cursor:pointer">When to use which</summary><ul style="margin:6px 0;padding-left:18px;color:#cbd9dd"><li><b>1d4 + need</b>: acquire, shoot, cyber attempts. AEW adds +2; EW jamming is −1.</li><li><b>Advantage</b>: the Intel Advantage roll.</li><li><b>Disadvantage</b>: attacks into missile defense (hit and damage).</li><li><b>Exploding shot</b>: roll to hit, then the damage die on a hit.</li><li><b>Initiative bid</b>: blue versus red, ties re-rolled.</li></ul></details>
 <div class="lbl" style="margin-top:10px">History</div><div class="log" style="max-height:130px">${D.hist.map(h=>`<div class="${h.o.cols[0]}">${h.t} · ${esc(h.o.kind)}: ${h.o.dice.join(', ')}${h.o.init?` → ${h.o.init}`:h.o.need?` → ${h.o.tot} vs ${h.o.need}+ ${h.o.ok?'✓':'✗'}`:h.o.sum||h.o.dmg?` → ${h.o.val}`:` → ${h.o.tot??h.o.val}`}</div>`).join('')||'<div>No rolls yet.</div>'}</div>`;
 const m=document.getElementById('modal');if(m&&m.querySelector('.drmodal'))m.querySelector('.drmodal').innerHTML=html;else modal(html,'drmodal');
}
H.drr=async d=>{if(UI.drBusy)return;UI.drBusy=true;try{const o=drRoll(d.k);const felt=document.getElementById('drfelt');
 if(felt){felt.innerHTML='';const els=o.dice.map(()=>{const e=document.createElement('div');e.className='d4';felt.appendChild(e);return e});const v=document.getElementById('drv');if(v)v.innerHTML='<span class="small muted">Rolling…</span>';
  await throwDice({felt,dice:els,side:o.cols[0],sides:o.cols},o.dice);UI.dr.lastPos=els.map(e=>e.style.transform)}}finally{UI.drBusy=false}diceModal()};

/* ---- boot ---- */
log=function(t,s){G.logn=(G.logn||0)+1;G.log.push({i:G.logn,t,s:s||'sys'});if(G.log.length>80)G.log.shift()};
(function(){const r0=render;render=function(){
 const p=document.getElementById('pop');if(p&&SCREEN!=='game')p.remove();
 if(SCREEN!=='game'&&UI.tray&&!UI.busy)closeTray();
 if(SCREEN==='drills'){TUT.on=false;const tb=document.querySelector('.tutbox');if(tb)tb.remove();return renderDrills()}
 if(SCREEN==='quiz'){TUT.on=false;const tb=document.querySelector('.tutbox');if(tb)tb.remove();return renderQuiz()}
 r0();
 if(TUT.on&&TSTEPS[TUT.i]&&TSTEPS[TUT.i].finish)setProg(p=>{p.tut=1});
}})();
render();
setTimeout(()=>netInit(),50);
